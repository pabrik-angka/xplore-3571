<!DOCTYPE html>
<html lang="id" data-theme="bumblebee">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xplore 3571</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  
  <!-- Tailwind v4 & DaisyUI v5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  
  <!-- Leaflet GIS Engine CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden bg-base-200 font-sans antialiased">

  <!-- Main Layout Grid Builder -->
  <div class="flex h-full w-full overflow-hidden">
    
    <!-- Sidebar Left Layout (Dikelola Komponen Dinamis) -->
    <aside id="sidebar-container" class="h-full w-80 bg-base-100 border-r border-base-300 transition-all duration-300 flex flex-col flex-none z-[1050] shadow-xl"></aside>
    
    <!-- Main Content Area Right Layout -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
      <!-- Top Navbar Container -->
      <div id="navbar-container" class="w-full flex-none"></div>

      <!-- Main Viewport Area -->
      <main class="flex-1 w-full h-full relative z-10">
        <!-- SPA View 1: Spasial (Peta) -->
        <div id="view-map" class="w-full h-full">
          <div id="map-container" class="w-full h-full"></div>
        </div>

        <!-- SPA View 2: Tabulasi (Tabel) -->
        <div id="view-table" class="hidden w-full h-full bg-base-100 flex flex-col overflow-hidden">
          
          <!-- 1. TOP TAB BAR (Multi-Dataset & Pivot Tabs) -->
          <div class="flex items-center justify-between px-3 pt-2 bg-base-200 border-b border-base-300 flex-none gap-2 overflow-x-auto">
            <div id="tabulation-tab-bar" class="tabs tabs-lifted flex-nowrap min-h-[36px]">
              <!-- Generated via JS -->
            </div>
            <button id="btn-trigger-pivot-modal" class="btn btn-xs sm:btn-sm btn-accent gap-1 flex-none mb-1 shadow-sm">
              ✨ ➕ Pivot Table
            </button>
          </div>

          <!-- 2. TOOLBAR TABEL (Search, Filter, Export, Pagination Info) -->
          <div class="flex flex-wrap items-center justify-between gap-2 p-2.5 bg-base-100 border-b border-base-300 flex-none text-xs">
            <div class="flex items-center gap-2">
              <div class="relative">
                <input type="text" id="table-global-search" placeholder="🔍 Cari data..." 
                       class="input input-xs sm:input-sm input-bordered w-40 sm:w-60" />
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span id="table-row-count-info" class="text-base-content/60 font-medium">0 baris</span>
              <select id="table-page-size" class="select select-xs select-bordered">
                <option value="50">50 / hal</option>
                <option value="100" selected>100 / hal</option>
                <option value="250">250 / hal</option>
                <option value="500">500 / hal</option>
              </select>
              <button id="btn-export-csv" class="btn btn-xs sm:btn-sm btn-outline btn-accent">📥 Export CSV</button>
            </div>
          </div>

          <!-- 3. CONTAINER GRID TABEL DAISYUI (Sticky Header & Left Stub Column) -->
          <div id="table-scroll-container" class="flex-1 overflow-auto relative">
            <table id="main-daisyui-table" class="table table-xs sm:table-sm table-pin-rows table-pin-cols w-full">
              <thead id="table-head" class="bg-base-200">
                <!-- Rendered via JS -->
              </thead>
              <tbody id="table-body">
                <!-- Rendered via JS -->
              </tbody>
            </table>
          </div>

          <!-- 4. PAGINATION FOOTER -->
          <div class="flex items-center justify-between px-4 py-2 bg-base-200 border-t border-base-300 flex-none text-xs">
            <span id="pagination-status" class="text-base-content/70">Halaman 1 dari 1</span>
            <div class="join">
              <button id="btn-prev-page" class="join-item btn btn-xs btn-outline">« Prev</button>
              <button id="btn-next-page" class="join-item btn btn-xs btn-outline">Next »</button>
            </div>
          </div>
        </div>

        <!-- SPA View 3: Dashboard (Visualisasi) -->
        <div id="view-dashboard" class="hidden w-full h-full bg-base-100 flex flex-col">
          <div class="flex items-center justify-between px-4 py-3 border-b border-base-300 bg-base-50 flex-none">
            <span class="text-sm font-bold text-accent">📈 Dashboard Analisis</span>
          </div>
          <div id="dashboard-container" class="flex-1 w-full overflow-y-auto p-4"></div>
        </div>

        <!-- FAB Router (Floating Action Button) - Pojok Kiri Bawah -->
        <div id="fab-router-container" class="fab absolute bottom-6 left-6 z-[1000]">
          <!-- Trigger Button (Menu Toggle) -->
          <div tabindex="0" role="button" class="btn btn-md btn-circle btn-primary shadow-xl">
            <span>🧭</span>
          </div>

          <!-- Close Visual Placeholder -->
          <div class="fab-close">
            <span class="btn btn-circle btn-md btn-error shadow-xl">✕</span>
          </div>

          <!-- Menu items yang muncul ketika FAB dibuka secara vertikal -->
          <div id="fab-item-map" class="flex items-center gap-2">
            <span class="badge badge-neutral shadow font-bold text-xs">Spasial</span>
            <a href="#map" data-route="#map" class="btn btn-circle btn-md shadow-lg">🗺️</a>
          </div>
          <div id="fab-item-table" class="flex items-center gap-2 hidden">
            <span class="badge badge-neutral shadow font-bold text-xs">Tabulasi</span>
            <a href="#table" data-route="#table" class="btn btn-circle btn-md shadow-lg">📊</a>
          </div>
          <div id="fab-item-dashboard" class="flex items-center gap-2 hidden">
            <span class="badge badge-neutral shadow font-bold text-xs">Dashboard</span>
            <a href="#dashboard" data-route="#dashboard" class="btn btn-circle btn-md shadow-lg">📈</a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Shared Modals Area Container (Injeksi Dialog via ui.js) -->
  <div id="modal-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
